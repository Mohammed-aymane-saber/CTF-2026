name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: CTFd tests and security checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CTF
    env:
      SECRET_KEY: ci-only-secret
      DATABASE_URL: sqlite:////tmp/ctfd-ci.db
      REDIS_URL: ""
      TESTING: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: CTF/development.txt

      - name: Install backend and test dependencies
        run: python -m pip install -r development.txt

      - name: Run backend tests
        run: >-
          pytest -rf --cov=CTFd --cov-report=term-missing
          --ignore-glob="**/node_modules/"
          -W ignore::sqlalchemy.exc.SADeprecationWarning
          -W ignore::sqlalchemy.exc.SAWarning
          -n auto

      - name: Run Bandit
        run: bandit -r CTFd -x CTFd/uploads --skip B105,B322

  container:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    strategy:
      matrix:
        include:
          - name: ctfd
            context: CTF
            file: CTF/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CTFd image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: eclipse-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish images to Docker Hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [container]
    strategy:
      matrix:
        include:
          - name: ctfd
            context: CTF
            file: CTF/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            aymanesbe3/eclipse-${{ matrix.name }}:latest
            aymanesbe3/eclipse-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secret-scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
