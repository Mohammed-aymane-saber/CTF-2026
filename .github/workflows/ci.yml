name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images to the protected production environment
        required: true
        default: false
        type: boolean

env:
  DOCKERHUB_NAMESPACE: aymanesbe3

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: CTFd tests and security checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CTF
    env:
      SECRET_KEY: ci-only-secret
      DATABASE_URL: sqlite:////tmp/ctfd-ci.db
      REDIS_URL: ""
      TESTING: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: CTF/development.txt

      - name: Install backend and test dependencies
        run: python -m pip install -r development.txt -r CTFd/plugins/admin_mfa/requirements.txt

      - name: Run backend tests
        run: >-
          pytest -rf --cov=CTFd --cov-report=term-missing
          --ignore-glob="**/node_modules/"
          -W ignore::sqlalchemy.exc.SADeprecationWarning
          -W ignore::sqlalchemy.exc.SAWarning
          -n auto

      - name: Run Bandit
        run: bandit -r CTFd -x CTFd/uploads --skip B105,B322

  container:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    strategy:
      matrix:
        include:
          - name: ctfd
            context: CTF
            file: CTF/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CTFd image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: eclipse-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: eclipse-${{ matrix.name }}:ci
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # ZAP runs here, against the image built above, so the CTFd image is
      # built once per run and no image artifact has to be transferred.
      - name: Start local CTFd environment from built image
        if: matrix.name == 'ctfd'
        run: docker compose -f CTF/docker-compose.yml -f CTF/docker-compose.ci.yml up -d --no-build

      - name: Wait for CTFd
        if: matrix.name == 'ctfd'
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost/ > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f CTF/docker-compose.yml -f CTF/docker-compose.ci.yml logs --no-color
          exit 1

      - name: Run OWASP ZAP baseline scan
        if: matrix.name == 'ctfd'
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost/
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-report

      - name: Publish ZAP report to job summary
        if: always() && matrix.name == 'ctfd'
        shell: bash
        run: |
          if [ -f report_md.md ]; then
            cat report_md.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ZAP report not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop local CTFd environment
        if: always() && matrix.name == 'ctfd'
        run: docker compose -f CTF/docker-compose.yml -f CTF/docker-compose.ci.yml down -v --remove-orphans

  trivy-filesystem:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          # These Yarn lockfiles belong to CTFd's optional theme build. The
          # production CTFd image installs Python requirements only; they are
          # tracked separately by Dependabot and will be scanned when themes
          # are built in CI.
          skip-files: CTF/CTFd/themes/admin/yarn.lock,CTF/CTFd/themes/core/yarn.lock
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          format: json
          output: trivy-filesystem.json

      # Reuse the single scan result for both the SARIF upload and the gate.
      - name: Convert Trivy results to SARIF
        if: always()
        run: trivy convert --format sarif --output trivy-filesystem.sarif trivy-filesystem.json

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-filesystem.sarif

      - name: Enforce Trivy findings
        run: trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 trivy-filesystem.json

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  publish:
    name: Publish images to Docker Hub
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    needs: [container, trivy-filesystem, secret-scan]
    environment:
      name: production
    concurrency:
      group: production-image-publish
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - name: ctfd
            context: CTF
            file: CTF/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/eclipse-${{ matrix.name }}:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/eclipse-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secret-scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
