# CI-only overrides for the CTFd integration environment.
# Run the image already built (and Trivy-scanned) by the CI container job
# instead of rebuilding it, and drop the base file's read-only source
# bind mount so the scan targets the image contents, not the checkout.
# Requires Docker Compose >= 2.24.4 for the !override tag.
services:
  ctfd:
    image: eclipse-ctfd:ci
    pull_policy: never
    volumes: !override
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
